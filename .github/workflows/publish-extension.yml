name: Publish Extension to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/extension/public/manifest.template.json','utf8')).version)")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create extension .env
        run: |
          printf '%s\n' \
            "VITE_EXTENSION_KEY=${{ secrets.VITE_EXTENSION_KEY }}" \
            "VITE_OAUTH_CLIENT_ID=${{ secrets.VITE_OAUTH_CLIENT_ID }}" \
            "VITE_PEXELS_API_KEY=${{ secrets.VITE_PEXELS_API_KEY }}" \
            "VITE_APP_FIREBASE_API_KEY=${{ secrets.VITE_APP_FIREBASE_API_KEY }}" \
            "VITE_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_APP_FIREBASE_AUTH_DOMAIN }}" \
            "VITE_APP_FIREBASE_PROJECT_ID=${{ secrets.VITE_APP_FIREBASE_PROJECT_ID }}" \
            "VITE_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_APP_FIREBASE_STORAGE_BUCKET }}" \
            "VITE_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_APP_FIREBASE_MESSAGING_SENDER_ID }}" \
            "VITE_APP_FIREBASE_APP_ID=${{ secrets.VITE_APP_FIREBASE_APP_ID }}" \
            > apps/extension/.env

      - name: Build extension
        run: pnpm --filter @apps/extension build

      - name: Write private key and create CRX
        run: |
          echo "${{ secrets.CHROME_PRIVATE_KEY }}" | base64 -d > /tmp/extension.pem
          npm install -g crx3
          crx3 apps/extension/dist -p /tmp/extension.pem -o apps/extension/dist.crx
          rm /tmp/extension.pem

      - name: Upload and publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          node --input-type=module -e "
            import chromeWebstoreUpload from 'chrome-webstore-upload';
            import fs from 'fs';

            const store = chromeWebstoreUpload({
              extensionId: process.env.CHROME_EXTENSION_ID,
              clientId: process.env.CHROME_CLIENT_ID,
              clientSecret: process.env.CHROME_CLIENT_SECRET,
              refreshToken: process.env.CHROME_REFRESH_TOKEN,
            });

            console.log('Fetching access token...');
            const token = await store.fetchToken();

            console.log('Uploading CRX...');
            const uploadRes = await store.uploadExisting(
              fs.createReadStream('apps/extension/dist.crx'),
              token
            );
            console.log('Upload response:', JSON.stringify(uploadRes, null, 2));

            if (uploadRes.uploadState === 'FAILURE') {
              console.error('Upload failed:', JSON.stringify(uploadRes.itemError));
              process.exit(1);
            }

            console.log('Publishing...');
            const publishRes = await store.publish('default', token);
            console.log('Publish response:', JSON.stringify(publishRes, null, 2));

            const status = publishRes.status || [];
            if (!status.includes('OK') && !status.includes('PUBLISHED_WITH_FRICTION_WARNING')) {
              console.error('Unexpected publish status:', status);
              process.exit(1);
            }

            console.log('Extension published successfully! Version: ${{ steps.version.outputs.version }}');
          "
