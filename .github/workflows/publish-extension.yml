name: Publish Extension to Chrome Web Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/extension/public/manifest.template.json','utf8')).version)")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create extension .env
        run: |
          printf '%s\n' \
            "VITE_EXTENSION_KEY=${{ secrets.VITE_EXTENSION_KEY }}" \
            "VITE_OAUTH_CLIENT_ID=${{ secrets.VITE_OAUTH_CLIENT_ID }}" \
            "VITE_PEXELS_API_KEY=${{ secrets.VITE_PEXELS_API_KEY }}" \
            "VITE_APP_FIREBASE_API_KEY=${{ secrets.VITE_APP_FIREBASE_API_KEY }}" \
            "VITE_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_APP_FIREBASE_AUTH_DOMAIN }}" \
            "VITE_APP_FIREBASE_PROJECT_ID=${{ secrets.VITE_APP_FIREBASE_PROJECT_ID }}" \
            "VITE_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_APP_FIREBASE_STORAGE_BUCKET }}" \
            "VITE_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_APP_FIREBASE_MESSAGING_SENDER_ID }}" \
            "VITE_APP_FIREBASE_APP_ID=${{ secrets.VITE_APP_FIREBASE_APP_ID }}" \
            > apps/extension/.env

      - name: Build extension
        run: pnpm --filter @apps/extension build

      - name: Write private key and create CRX
        run: |
          echo "${{ secrets.CHROME_PRIVATE_KEY }}" | base64 -d > /tmp/extension.pem
          npm install -g crx3
          crx3 apps/extension/dist -p /tmp/extension.pem -o apps/extension/dist.crx
          rm /tmp/extension.pem

      - name: Upload and publish to Chrome Web Store (v2 API)
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          # Exchange refresh token for access token
          TOKEN_RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CHROME_CLIENT_ID}" \
            -d "client_secret=${CHROME_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            if (data.error) { console.error('Token error:', data.error_description || data.error); process.exit(1); }
            console.log(data.access_token);
          ")

          # Upload CRX via v2 API
          echo "Uploading CRX..."
          UPLOAD_RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/x-chrome-extension" \
            -X POST \
            --data-binary @apps/extension/dist.crx \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:upload")

          echo "Upload response:"
          echo "$UPLOAD_RESPONSE" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log(JSON.stringify(data, null, 2));
            const state = data.uploadState || data.itemRevisionState;
            if (state !== 'SUCCESS' && state !== 'SUCCEEDED') {
              if (data.error) { console.error('Upload error:', data.error.message || JSON.stringify(data.error)); process.exit(1); }
              if (data.itemErrors) { console.error('Item errors:', JSON.stringify(data.itemErrors)); process.exit(1); }
              console.error('Upload failed:', state);
              process.exit(1);
            }
          "

          # Publish via v2 API
          echo "Publishing extension..."
          PUBLISH_RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Length: 0" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}:publish")

          echo "$PUBLISH_RESPONSE" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            console.log('Publish response:', JSON.stringify(data, null, 2));
            const state = data.status || data.publishStatus;
            const successStates = ['PUBLISHED', 'PENDING_REVIEW', 'PUBLISHED_TO_TESTERS', 'STAGED', 'OK'];
            const statuses = Array.isArray(state) ? state : [state];
            const isSuccess = statuses.some(s => successStates.includes(s));
            if (!isSuccess) {
              console.error('Unexpected publish state:', state);
              process.exit(1);
            }
          "

          echo "Extension published. Version: ${{ steps.version.outputs.version }}"
